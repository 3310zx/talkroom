name: llm_chat_app
description: "LLM Chat App：Flutter 跨平台第三方 LLM 对话客户端（微信风格界面，支持 OpenAI 兼容 API、主动消息、局域网双端同步）。详见 PRD 第 1-9 章。"
publish_to: "none"
version: 1.2.8

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理（PRD 2.2）
  flutter_riverpod: ^2.5.1

  # HTTP / SSE（PRD 2.4 P0）
  dio: ^5.4.0

  # Markdown 渲染（聊天消息，PRD 2.4 P0）
  flutter_markdown: ^0.7.1
  markdown: ^7.3.1 # flutter_markdown 的 MarkdownElementBuilder 直接依赖（message_bubble 代码块高亮）

  # 代码块高亮（聊天消息代码块，PRD 2.4 P0）
  flutter_highlight: ^0.7.0

  # 数学公式渲染（PRD 2.4 P1 提升：LaTeX $$块$$/$行内$，v1.0.13 起 P0）
  flutter_math_fork: ^0.7.2

  # 系统分享文本（PRD 2.4 / R3 消息菜单「分享」）
  share_plus: ^7.2.2

  # 语音输入（PRD 2.4 / R8：系统语音识别，能力不可用时隐藏并提示不崩溃）
  speech_to_text: ^7.5.0

  # 相册选图（PRD 2.4 / R9：发送图片，OpenAI 多模态 image_url 附加）
  image_picker: ^1.1.2

  # 文件选择（PRD 2.4 / R9：发送任意文件，模型不支持时中文提示）
  file_picker: ^8.1.2

  # 本地存储（PRD 2.3）
  # SQLite（移动端 sqflite / 桌面端 sqflite_common_ffi / Web IndexedDB wasm）
  sqflite: ^2.3.2
  sqflite_common: ^2.5.13
  sqflite_common_ffi: ^2.3.0
  sqflite_common_ffi_web: ^1.2.0
  # key-value 缓存（应用设置/轻量状态）
  hive_ce: ^2.5.0
  path_provider: ^2.1.2

  # API Key 加密存储（PRD 6.2）
  flutter_secure_storage: ^9.2.0

  # 设备/会话唯一标识（局域网同步 devices.device_id，PRD 第 7 章）
  uuid: ^4.4.0

  # 局域网本地服务器（PRD 第 7 章，Dart shelf）
  shelf: ^1.4.1
  shelf_router: ^1.1.4

  # 本地通知（PRD 第 5 章 P1「LLM 主动发消息」：生成完成/失败提醒、点击跳转会话）
  # 注意：新增依赖后需重新执行 flutter pub get
  # 说明：锁定 16.x 而非 17.x——17.x 引入 objective_c native assets，
  #   构建 macOS 目标需要完整 Xcode；16.x 使用传统插件注册，兼容无完整 Xcode 环境。
  flutter_local_notifications: ^16.3.2

  # PRD 2.4 中的 P1 依赖（按需添加）：
  # url_launcher / file_picker / image_picker / workmanager /
  # android_alarm_manager_plus / logger

  # 检查更新（P2）：当前版本号由 lib/core/constants.dart 的 appVersion 维护，
  # 与 pubspec version 保持一致（避免引入 package_info_plus 的 Kotlin/AGP 兼容问题）。
  # 检查更新（P2）：打开 APK 下载链接
  url_launcher: ^6.3.0

  # 主题动态取色（v1.2.2：莫奈/壁纸动态色，Material You；非 Android 12+ 自动降级）
  # 版本约束：^1.7.0 兼容 Flutter 3.47 / Dart 3.x
  dynamic_color: ^1.7.0

  # 会话导出 PDF（R11：Markdown/纯文本/PDF 导出，PRD 6.3）
  pdf: ^3.10.7

  # 文件解析器（v1.2.1：发送前解析本地文档提取文本，节省 token）
  # syncfusion_flutter_pdf 纯 Dart PDF 文本层提取（pdfx 2.x 已移除文本提取
  # API 且为平台插件，无法在 compute isolate/单测使用，故不用 pdfx）；
  # archive+xml 解 docx document.xml 提取 w:t
  syncfusion_flutter_pdf: ^35.1.37
  archive: ^4.3.0
  xml: ^7.0.1

  # 局域网同步二维码（R15：电脑端展示配对二维码，扫码自动填写）
  qr_flutter: ^4.1.0

  # 局域网同步扫码配对（R15：手机端扫描电脑二维码自动配对）
  mobile_scanner: ^5.2.3
  web: ^1.1.1
  cupertino_icons: ^1.0.8

# 依赖覆盖：path_provider_foundation 2.5+ 与 sqlite3 3.x 引入 native assets
# （objective_c / code_assets hook），构建 macOS 目标需要完整 Xcode/工具链。
# 固定 2.4.1 / 2.4.6 使用传统 FFI（运行时加载系统库），保证无完整工具链可编译运行。
dependency_overrides:
  path_provider_foundation: 2.4.1
  sqlite3: 3.5.2
  path_provider_android: 2.2.11

# sqlite3 hook 构建配置：使用操作系统自带 SQLite（macOS/Windows/Linux 均有），
# 避免构建/测试阶段从 GitHub 下载预编译 dylib（离线/内网环境可用）。
hooks:
  user_defines:
    sqlite3:
      source: system

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
